[package]
name = "vj_arena_rs_pro"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "OSVJ"
path = "src/main.rs"

[[bin]]
name = "OSVJ_Setup_v1_2"
path = "src/installer.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.27"
wgpu = "0.19"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = "0.14"
chrono = "0.4"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
